[versions]
ktor = "3.5.1"
micrometer = "1.17.0"
exposed = "1.3.1"
koin = "4.2.2"
koter = "0.0.1"
jackson = "3.0.3"

# Micronaut 相关版本
micronaut = "5.2.2"
micronaut-platform = "5.1.5"
micronaut-validation = "5.1.0"
micronaut-data  = "5.1.4"
micronaut-sql = "7.1.2"
micronaut-redis = "7.1.0"
micronaut-serde = "3.1.1"
micronaut-security = "5.3.2"
micronaut-openapi = "7.2.0"
micronaut-test = "5.1.1"
bcprov = "1.84"
jbcrypt = "0.4"

# DB
postgre = "42.7.13"

# Jakarta 相关
jakarta-validation = "4.0.0-M1"

# Log 相关
slf4j = "2.0.18"
kotlin-logging = "8.0.4"
micronaut-tracing-opentelemetry = "8.2.0"

# Test 相关
junit = "6.1.3"

[libraries]
# Ktor核心
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }

# 数据库
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposed" }

# 监控
micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }

# 依赖注入
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-ktor = { group = "io.insert-koin", name = "koin-ktor", version.ref = "koin" }

# 日志：Kotlin Logging（API）
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }

# 日志：SLF4J
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

# 日志：OpenTelemetry（实现）
micronaut-tracing-opentelemetry = { group = "io.micronaut.tracing", name = "micronaut-tracing-opentelemetry", version.ref = "micronaut-tracing-opentelemetry" }


# Micronaut 框架 Core
micronaut-core = { group = "io.micronaut", name = "micronaut-core", version.ref = "micronaut" }
micronaut-runtime = { group = "io.micronaut", name = "micronaut-runtime", version.ref = "micronaut" }
micronaut-inject-kotlin = { group = "io.micronaut", name = "micronaut-inject-kotlin", version.ref = "micronaut" }
micronaut-http-client = { group = "io.micronaut", name = "micronaut-http-client", version.ref = "micronaut" }
micronaut-http = { group = "io.micronaut", name = "micronaut-http", version.ref = "micronaut" }
micronaut-http-server-netty = { group = "io.micronaut", name = "micronaut-http-server-netty", version.ref = "micronaut" }
micronaut-logging = { group = "io.micronaut", name = "micronaut-logging", version.ref = "micronaut" }
micronaut-context = { group = "io.micronaut", name = "micronaut-context", version.ref = "micronaut" }
micronaut-jackson-databind = { group = "io.micronaut", name = "micronaut-jackson-databind", version.ref = "micronaut" }

# Micronaut Platform
micronaut-platform = { group = "io.micronaut.platform", name = "micronaut-platform", version.ref = "micronaut-platform" }

# Micronaut Serde
micronaut-serde-jackson = { group = "io.micronaut.serde", name = "micronaut-serde-jackson", version.ref = "micronaut-serde" }
micronaut-jackson-processor = { group = "io.micronaut.serde", name = "micronaut-serde-processor", version.ref = "micronaut-serde" }

# Micronaut Data 框架
micronaut-data-runtime = { group = "io.micronaut.data", name = "micronaut-data-runtime", version.ref = "micronaut-data" }
micronaut-data-processor = { group = "io.micronaut.data", name = "micronaut-data-processor", version.ref = "micronaut-data" }
micronaut-data-jdbc = { group = "io.micronaut.data", name = "micronaut-data-jdbc", version.ref = "micronaut-data" }
micronaut-data-tx = { group = "io.micronaut.data", name = "micronaut-data-tx", version.ref = "micronaut-data" }

# Micronaut Validation
micronaut-validation = { group = "io.micronaut.validation", name = "micronaut-validation", version.ref = "micronaut-validation" }
micronaut-validation-processor = { group = "io.micronaut.validation", name = "micronaut-validation-processor", version.ref = "micronaut-validation" }

# Micronaut Security
micronaut-security = { group = "io.micronaut.security", name = "micronaut-security", version.ref = "micronaut-security" }
micronaut-security-jwt = { group = "io.micronaut.security", name = "micronaut-security-jwt", version.ref = "micronaut-security" }

# Micronaut OpenApi
micronaut-openapi = { group = "io.micronaut.openapi", name = "micronaut-openapi", version.ref = "micronaut-openapi" }
micronaut-openapi-annotations = { module = "io.micronaut.openapi:micronaut-openapi-annotations", version.ref = "micronaut-openapi" }

# Micronaut Test
micronaut-test-junit5 = { group = "io.micronaut.test", name = "micronaut-test-junit5", version.ref = "micronaut-test" }

# Micronaut Redis
micronaut-redis-lettuce = { group = "io.micronaut.redis", name = "micronaut-redis-lettuce", version.ref = "micronaut-redis" }

# JUnit Jupiter Test
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }

# Hikari 连接池
micronaut-jdbc-hikari = { group = "io.micronaut.sql", name = "micronaut-jdbc-hikari", version.ref = "micronaut-sql" }

# Bouncy Castle 加密库
bcprov-jdk18on = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bcprov" }
# jBCrypt 密码哈希库
jbcrypt = { group = "org.mindrot", name = "jbcrypt", version.ref = "jbcrypt" }


# Maria DB 驱动

# PostgreSQL 驱动
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgre" }

# Jakarta Validation
jakarta-validation = { group = "jakarta.validation", name = "jakarta.validation-api", version.ref = "jakarta-validation" }