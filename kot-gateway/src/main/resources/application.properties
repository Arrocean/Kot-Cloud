micronaut.application.name=kot-gateway
micronaut.server.port=${GATEWAY_PORT:8080}
micronaut.server.log-handled-exceptions=false
# GatewayAuthenticationFilter owns JWT, session and route identity checks.
micronaut.security.filter.enabled=false
micronaut.http.client.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:10s}
micronaut.http.client.read-timeout=${GATEWAY_READ_TIMEOUT:30s}

redis.uri=${REDIS_URI:`redis://127.0.0.1:6379/0`}
kot.gateway.redis.key-prefix=${SECURITY_REDIS_KEY_PREFIX:`kot:security`}
kot.gateway.jwt.secret=${JWT_SECRET:change-this-secret-at-least-32-bytes-long}
kot.gateway.jwt.issuer=${JWT_ISSUER:}
kot.gateway.jwt.audience=${JWT_AUDIENCE:}
kot.gateway.public-paths=/v1/admin-api/system/auth/login,/v1/admin-api/system/auth/register,/v1/api/auth/login,/v1/api/auth/register-by-username,/v1/api/auth/register-by-mobile
kot.gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:`http://localhost:3000`}
kot.gateway.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

kot.gateway.routes[0].id=system
kot.gateway.routes[0].path-prefix=/v1/admin-api/system
kot.gateway.routes[0].target-uri=${SYSTEM_SERVICE_URL:`http://127.0.0.1:1164`}
kot.gateway.routes[0].strip-prefix=false
kot.gateway.routes[0].enabled=true
kot.gateway.routes[0].allowed-user-types=ADMIN
kot.gateway.routes[1].id=member
kot.gateway.routes[1].path-prefix=/v1/api
kot.gateway.routes[1].target-uri=${MEMBER_SERVICE_URL:`http://127.0.0.1:1164`}
kot.gateway.routes[1].strip-prefix=false
kot.gateway.routes[1].enabled=true
kot.gateway.routes[1].allowed-user-types=USER
